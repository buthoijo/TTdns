user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;
events {
    worker_connections 1024;
}
http {
    log_format main '[$time_local] $proxy_protocol_addr "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    set_real_ip_from 127.0.0.1;

    include /etc/nginx/mime.types;
    include /etc/nginx/conf.d/xray.conf;
}


http {
    # Dynamically set the Connection header based on the client's Upgrade header
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream backend_app {
        # Use ip_hash if scaling across multiple backend instances (sticky sessions)
        # ip_hash;
        server 127.0.0.1:8080;
    }

    server {
        listen 80;
        server_name example.com;

        location /ws/ {
            proxy_pass http://backend_app;

            # 1. Force HTTP/1.1 (required for WebSocket handshake)
            proxy_http_version 1.1;

            # 2. Forward Upgrade and Connection headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # 3. Standard forwarding headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 4. Prevent idle connections from dropping after default 60s
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            # 5. Disable buffering for real-time data flow
            proxy_buffering off;
        }
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name example.com;

    location /ws/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

if (u->headers_in.status_n == NGX_HTTP_SWITCHING_PROTOCOLS) {
    u->keepalive = 0;  // Disable keep-alive for upgraded connections
    if (r->headers_in.upgrade) {
        u->upgrade = 1;  // Enable upgrade mode
    }
}
